<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Everything</title>
    <!-- 
      GitHub Pages SPA Redirect Fix
      Inspired by: https://github.com/rafgraph/spa-github-pages
      
      When GitHub Pages returns a 404 for any deep path (e.g. /sync, /settings),
      this page captures the full URL and redirects to the root index.html,
      passing the original path via sessionStorage so the React router can restore it.
    -->
    <script>
      // Encode the full path, query, and hash into the redirect URL
      // so that the SPA can pick it up and navigate correctly.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=' +
        encodeURIComponent(l.pathname + l.search) + '&h=' + encodeURIComponent(l.hash) +
        (l.search ? '&' : '')
      );
    </script>
  </head>
  <body></body>
</html>
